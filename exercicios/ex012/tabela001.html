<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        table {
            width: 400px;
            height: 400px;
            border-collapse: collapse;
        }

        td{
            border: 1px solid black;
            padding: 8px;
            text-align: center; /* Alinhamento horizontal (da esquerda pra diteira*/
            vertical-align: middle; /*Alinhamento vertical (de cima pra baixo*/
        }
    </style>
</head>
<body>
    <h1>Minha Primeira Tabela</h1>
    <!--
        HIERARQUIA DE TABELAS SIMPLES

        1 - table = tabela
            2- table row = linha de tabela
                3 - table header = cabeçalho da tabela
                    4 - table data = dados da tabela
    -->
    <table>
        <tr> <!-- Primeira linha - row-->
            <td>A1</td> <!-- Dados -data-->
            <td>B1</td>
            <td>C1</td>
        </tr>
        <tr> <!-- Segunda linha - row-->
            <td>A2</td> <!-- Dados -data-->
            <td>B2</td>
            <td>C2</td>
        </tr>
        <tr> <!-- Terceira linha - row-->
            <td>A3</td> <!-- Dados -data-->
            <td>B3</td>
            <td>C3</td>
        </tr>
        <tr> <!-- Quarta linha - row-->
            <td>A4</td> <!-- Dados -data-->
            <td>B4</td>
            <td>C4</td>
        </tr>
    </table>
</body>
</html>
