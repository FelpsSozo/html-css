<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }
        table{
            width: 500px;
            border-collapse: collapse;
        }
        td, th {
            border: 1px solid black;
            padding: 10px;
            text-align: center;
        }
        thead, tfoot {
            background-color:gray;
            color: white;
        }
        .num {
            text-align: right;
        }
    </style>
</head>
<body>
    <h1>Uso de Tabelas Grandes</h1> 
    <!--
    
    ANATOMIA PARA TABELAS GRANDES
        TABLE (TABELA)
            THEAD (CABEÇA DA TABELA)
                TR, TD, TH
            TBODY (CORPO DA TABELA)
                TR, TD, TH
            TFOOT (RODAPÉ DA TABELA)
                TR, TD, TH
     -->
    
     <table>
        <thead>
            <tr>
                <th>Estado</th>
                <th>População</th>

            </tr>
        </thead>
        <tbody>
            <tr>
                <td>São Paulo</td>
                <td class="num"> 45.917.041</td>
            </tr>
            <tr>
                <td>Minas Gerais</td>
                <td class="num"> 21.629.542</td>
            </tr>
            <tr>
                <td>Rio de Janeiro</td>
                <td class="num"> 16.765.123</td>
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <th> Total de Habitantes</th>
                <td class="num"><strong>Número total aqui</strong></td>
            </tr>
        </tfoot>

     </table>
</body>
</html>
